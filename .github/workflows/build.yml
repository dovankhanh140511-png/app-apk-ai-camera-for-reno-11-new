            <script type="module">
              import { FilesetResolver, ObjectDetector } from "./mediapipe/vision_bundle.mjs";

              const video = document.getElementById("cameraVideo");
              const glCanvas = document.getElementById("glCanvas");
              const overlayCanvas = document.getElementById("overlayCanvas");
              const ctx = overlayCanvas.getContext("2d");
              const stage = document.getElementById("stage");

              const statusBadge = document.getElementById("statusBadge");
              const statusText = document.getElementById("statusText");
              const metaInfo = document.getElementById("metaInfo");
              const colorInfo = document.getElementById("colorInfo");
              const shutterBtn = document.getElementById("shutterBtn");
              const switchCamBtn = document.getElementById("switchCamBtn");
              const toggleAiBtn = document.getElementById("toggleAiBtn");
              const aiLabel = document.getElementById("aiLabel");
              const ratioBtns = document.querySelectorAll(".ratio-btn");

              const toggleColorBtn = document.getElementById("toggleColorBtn");
              const colorDrawer = document.getElementById("colorDrawer");
              const tempSlider = document.getElementById("tempSlider");
              const tempVal = document.getElementById("tempVal");
              const resetTempBtn = document.getElementById("resetTempBtn");
              const intensityRow = document.getElementById("intensityRow");
              const intensitySlider = document.getElementById("intensitySlider");
              const intensityVal = document.getElementById("intensityVal");
              const lutStrip = document.getElementById("lutStrip");

              const openSourceBtn = document.getElementById("openSourceBtn");
              const sourceModal = document.getElementById("sourceModal");
              const closeSourceBtn = document.getElementById("closeSourceBtn");
              const pickFileBtn = document.getElementById("pickFileBtn");
              const lutFileInput = document.getElementById("lutFileInput");
              const lutUrlInput = document.getElementById("lutUrlInput");
              const loadUrlBtn = document.getElementById("loadUrlBtn");

              const errorOverlay = document.getElementById("errorOverlay");
              const errorDesc = document.getElementById("errorDesc");
              const retryBtn = document.getElementById("retryBtn");
              const previewModal = document.getElementById("previewModal");
              const previewImg = document.getElementById("previewImg");
              const previewRes = document.getElementById("previewRes");
              const previewSub = document.getElementById("previewSub");
              const retakeBtn = document.getElementById("retakeBtn");
              const downloadBtn = document.getElementById("downloadBtn");
              const toastEl = document.getElementById("toastEl");
              const flashEl = document.getElementById("flashEl");

              const aiCanvas = document.createElement("canvas");
              const aiCtx = aiCanvas.getContext("2d", { willReadFrequently: false });

              let objectDetector = null;
              let currentStream = null;
              let facingMode = "environment";
              let targetRatio = 4 / 5;
              let aiEnabled = true;
              let rafId = null;
              let aiTimerId = null;
              let isInferring = false;
              let lastInferTs = 0;

              let smoothedCrop = null;
              let latestDetections = [];
              let capturedDataUrl = null;
              let capturedBlob = null;

              let kelvin = 5500;
              let lutIntensity = 0.85;
              let activeLutId = "none";
              let lutList = [];

              const LABEL_VI = {
                person: "Người", cat: "Mèo", dog: "Chó", bird: "Chim",
                car: "Ô tô", motorcycle: "Xe máy", bicycle: "Xe đạp",
                bottle: "Chai", cup: "Ly / Cốc", chair: "Ghế",
                potted_plant: "Chậu cây", cell_phone: "Điện thoại",
                laptop: "Laptop", book: "Sách"
              };

              function showToast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add("show");
                clearTimeout(showToast._t);
                showToast._t = setTimeout(() => toastEl.classList.remove("show"), 2600);
              }

              function getTempGains(k) {
                const t = Math.max(-1, Math.min(1, (k - 5500) / 3000));
                let r = 1, g = 1, b = 1;
                if (t >= 0) {
                  r = 1 + 0.28 * t;
                  g = 1 + 0.04 * t;
                  b = 1 - 0.28 * t;
                } else {
                  const c = -t;
                  r = 1 - 0.24 * c;
                  g = 1 - 0.02 * c;
                  b = 1 + 0.30 * c;
                }
                const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                return [r / lum, g / lum, b / lum];
              }

              function buildProceduralLUT(size, transformFn) {
                const data = new Uint8Array(size * size * size * 4);
                let ptr = 0;
                for (let b = 0; b < size; b++) {
                  const fb = b / (size - 1);
                  for (let g = 0; g < size; g++) {
                    const fg = g / (size - 1);
                    for (let r = 0; r < size; r++) {
                      const fr = r / (size - 1);
                      const [or, og, ob] = transformFn(fr, fg, fb);
                      data[ptr++] = Math.max(0, Math.min(255, Math.round(or * 255)));
                      data[ptr++] = Math.max(0, Math.min(255, Math.round(og * 255)));
                      data[ptr++] = Math.max(0, Math.min(255, Math.round(ob * 255)));
                      data[ptr++] = 255;
                    }
                  }
                }
                return { size, data };
              }

              function sCurve(v, strength) {
                const c = v - 0.5;
                return Math.max(0, Math.min(1, v + strength * c * (0.25 - c * c)));
              }

              function createBuiltinLuts() {
                const N = 17;
                return [
                  { id: "none", name: "Gốc", swatch: "linear-gradient(135deg,#e4e4e7,#52525b)", custom: false, size: 2, data: null },
                  {
                    id: "fuji", name: "Fuji Pro", swatch: "linear-gradient(135deg,#34d399,#0f766e)", custom: false,
                    ...buildProceduralLUT(N, (r, g, b) => {
                      r = sCurve(r, 0.55); g = sCurve(g, 0.6); b = sCurve(b, 0.5);
                      const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                      r = lum + (r - lum) * 0.92;
                      g = lum + (g - lum) * 1.04;
                      b = lum + (b - lum) * 0.96;
                      const sh = Math.pow(1 - lum, 2);
                      return [r * 0.96 + 0.02, g * 0.98 + 0.03 * sh + 0.015, b * 0.97 + 0.04 * sh + 0.02];
                    })
                  },
                  {
                    id: "kodak", name: "Kodak Gold", swatch: "linear-gradient(135deg,#fbbf24,#b45309)", custom: false,
                    ...buildProceduralLUT(N, (r, g, b) => {
                      r = sCurve(r, 0.65); g = sCurve(g, 0.58); b = sCurve(b, 0.45);
                      const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                      r = lum + (r - lum) * 1.12;
                      g = lum + (g - lum) * 1.04;
                      b = lum + (b - lum) * 0.88;
                      return [r * 1.03 + 0.025, g * 1.0 + 0.015, b * 0.89 + 0.01];
                    })
                  },
                  {
                    id: "teal", name: "Cine Teal", swatch: "linear-gradient(135deg,#06b6d4,#f97316)", custom: false,
                    ...buildProceduralLUT(N, (r, g, b) => {
                      r = sCurve(r, 0.8); g = sCurve(g, 0.72); b = sCurve(b, 0.75);
                      const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                      const sh = Math.pow(1 - lum, 1.6);
                      const hi = Math.pow(lum, 1.5);
                      return [
                        r * 0.96 - 0.06 * sh + 0.09 * hi,
                        g * 0.98 + 0.04 * sh + 0.02 * hi,
                        b * 0.98 + 0.10 * sh - 0.08 * hi
                      ];
                    })
                  },
                  {
                    id: "leica", name: "Leica B&W", swatch: "linear-gradient(135deg,#ffffff,#18181b)", custom: false,
                    ...buildProceduralLUT(N, (r, g, b) => {
                      const lum = 0.26 * r + 0.62 * g + 0.12 * b;
                      const m = sCurve(lum, 1.15);
                      return [m, m, m];
                    })
                  },
                  {
                    id: "moody", name: "Moody Film", swatch: "linear-gradient(135deg,#64748b,#0f172a)", custom: false,
                    ...buildProceduralLUT(N, (r, g, b) => {
                      r = sCurve(r, 0.45); g = sCurve(g, 0.45); b = sCurve(b, 0.5);
                      const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                      r = lum + (r - lum) * 0.72;
                      g = lum + (g - lum) * 0.76;
                      b = lum + (b - lum) * 0.82;
                      return [r * 0.90 + 0.035, g * 0.91 + 0.038, b * 0.94 + 0.045];
                    })
                  }
                ];
              }

              function parseCubeFile(text, fallbackName) {
                if (typeof text !== "string" || text.length > 6 * 1024 * 1024) {
                  throw new Error("File quá lớn (tối đa 5MB)");
                }
                if (text.includes("<html") || text.includes("<script")) {
                  throw new Error("Không phải file LUT .cube hợp lệ");
                }

                const lines = text.split(/\r?\n/);
                let title = fallbackName.replace(/\.(cube|txt)$/i, "").slice(0, 22) || "LUT Tùy chỉnh";
                let size3D = 0;
                let size1D = 0;
                let dMin = [0, 0, 0];
                let dMax = [1, 1, 1];
                const rawTriplets = [];

                for (let rawLine of lines) {
                  const line = rawLine.trim();
                  if (!line || line.startsWith("#")) continue;
                  if (line.startsWith("TITLE")) {
                    const m = line.match(/TITLE\s+"?([^"]+)"?/i);
                    if (m && m[1]) title = m[1].trim().slice(0, 22);
                    continue;
                  }
                  if (line.startsWith("LUT_3D_SIZE")) {
                    size3D = parseInt(line.split(/\s+/)[1], 10);
                    continue;
                  }
                  if (line.startsWith("LUT_1D_SIZE")) {
                    size1D = parseInt(line.split(/\s+/)[1], 10);
                    continue;
                  }
                  if (line.startsWith("DOMAIN_MIN")) {
                    const p = line.split(/\s+/).slice(1).map(Number);
                    if (p.length === 3 && p.every(Number.isFinite)) dMin = p;
                    continue;
                  }
                  if (line.startsWith("DOMAIN_MAX")) {
                    const p = line.split(/\s+/).slice(1).map(Number);
                    if (p.length === 3 && p.every(Number.isFinite)) dMax = p;
                    continue;
                  }
                  if (/^[A-Za-z_]/.test(line)) continue;

                  const parts = line.split(/\s+/);
                  if (parts.length >= 3) {
                    const r = Number(parts[0]);
                    const g = Number(parts[1]);
                    const b = Number(parts[2]);
                    if (Number.isFinite(r) && Number.isFinite(g) && Number.isFinite(b)) {
                      rawTriplets.push(r, g, b);
                    }
                  }
                }

                const norm = (v, idx) => {
                  const span = dMax[idx] - dMin[idx] || 1;
                  return Math.max(0, Math.min(1, (v - dMin[idx]) / span));
                };

                if (size1D >= 2 && size1D <= 4096 && rawTriplets.length >= size1D * 3 && size3D === 0) {
                  const outSize = 17;
                  const sample1D = (u, ch) => {
                    const pos = u * (size1D - 1);
                    const i0 = Math.floor(pos);
                    const i1 = Math.min(size1D - 1, i0 + 1);
                    const f = pos - i0;
                    const v0 = norm(rawTriplets[i0 * 3 + ch], ch);
                    const v1 = norm(rawTriplets[i1 * 3 + ch], ch);
                    return v0 + (v1 - v0) * f;
                  };
                  const out = buildProceduralLUT(outSize, (r, g, b) => [
                    sample1D(r, 0), sample1D(g, 1), sample1D(b, 2)
                  ]);
                  return { name: title, size: out.size, data: out.data };
                }

                if (size3D < 2 || size3D > 65 || rawTriplets.length < size3D * size3D * size3D * 3) {
                  throw new Error("Cấu trúc file .cube không đúng chuẩn LUT 3D");
                }

                const targetSize = size3D > 33 ? 33 : size3D;
                const sample3D = (fr, fg, fb) => {
                  const x = fr * (size3D - 1);
                  const y = fg * (size3D - 1);
                  const z = fb * (size3D - 1);
                  const x0 = Math.floor(x), x1 = Math.min(size3D - 1, x0 + 1), fx = x - x0;
                  const y0 = Math.floor(y), y1 = Math.min(size3D - 1, y0 + 1), fy = y - y0;
                  const z0 = Math.floor(z), z1 = Math.min(size3D - 1, z0 + 1), fz = z - z0;
                  const idx = (rx, gy, bz) => (rx + size3D * (gy + size3D * bz)) * 3;

                  const out = [0, 0, 0];
                  for (let ch = 0; ch < 3; ch++) {
