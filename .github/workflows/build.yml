              @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

              .preview-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
              .preview-heading { display: flex; flex-direction: column; gap: 2px; }
              .preview-title { font-size: 16px; font-weight: 700; }
              .preview-sub { font-size: 12px; color: var(--muted); }

              .preview-res-badge {
                font-size: 12px; font-weight: 700; color: #86efac;
