                <div class="source-note">
                  Chỉ đọc định dạng văn bản chuẩn <b>.cube</b> (3D/1D LUT từ DaVinci, Lightroom, Fuji/Kodak...), giới hạn dưới 5MB, kiểm tra an toàn trước khi áp và lưu offline vào máy.
                </div>

                <input type="file" id="lutFileInput" accept=".cube,.txt" style="display:none;" />
