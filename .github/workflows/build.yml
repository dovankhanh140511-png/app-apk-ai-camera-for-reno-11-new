            <div class="preview-modal" id="previewModal">
              <div class="preview-top">
                <div class="preview-heading">
                  <div class="preview-title">Bố cục hoàn tất</div>
                  <div class="preview-sub" id="previewSub">Đã cắt độ phân giải gốc</div>
                </div>
                <div class="preview-res-badge" id="previewRes">0 × 0 px</div>
