name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'
          cache-disabled: true

      - name: Generate offline Android project
        run: |
          mkdir -p app/src/main/assets/mediapipe/wasm app/src/main/java/com/example/aicamera

          echo "Dang tai san bo AI MediaPipe de chay Offline 100%..."
          npm install --no-save --prefix /tmp/mp @mediapipe/tasks-vision@0.10.21
          cp /tmp/mp/node_modules/@mediapipe/tasks-vision/vision_bundle.mjs app/src/main/assets/mediapipe/
          cp -r /tmp/mp/node_modules/@mediapipe/tasks-vision/wasm/* app/src/main/assets/mediapipe/wasm/
          rm -rf /tmp/mp
          curl -fsSL --retry 3 -o app/src/main/assets/mediapipe/efficientdet_lite0.tflite \
            "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite"

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=false
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AICamera"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.11.1" apply false
              id("org.jetbrains.kotlin.android") version "2.2.20" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.aicamera"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.example.aicamera"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = 3
                  versionName = "3.0"
              }

              androidResources {
                  noCompress += listOf("tflite", "wasm")
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.activity:activity-ktx:1.10.1")
              implementation("androidx.webkit:webkit:1.12.1")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="AI Camera"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/aicamera/MainActivity.kt
          package com.example.aicamera

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.util.Base64
          import android.webkit.*
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.SystemBarStyle
          import androidx.activity.enableEdgeToEdge
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.webkit.WebViewAssetLoader

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private var pendingPermissionRequest: PermissionRequest? = null
              private var filePathCallback: ValueCallback<Array<Uri>>? = null
              private val appUrl = "https://appassets.androidplatform.net/assets/index.html"

              private val cameraLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { granted ->
                  if (granted) {
                      val req = pendingPermissionRequest
                      pendingPermissionRequest = null
                      if (req != null) {
                          req.grant(req.resources)
                      } else if (::webView.isInitialized) {
                          webView.loadUrl(appUrl)
                      }
                  } else {
                      pendingPermissionRequest?.deny()
                      pendingPermissionRequest = null
                      Toast.makeText(this, "Vui lòng cấp quyền Camera để chụp ảnh", Toast.LENGTH_LONG).show()
                      if (::webView.isInitialized && webView.url == null) {
                          webView.loadUrl(appUrl)
                      }
                  }
              }

              private val fileChooserLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  val cb = filePathCallback
                  filePathCallback = null
                  if (cb == null) return@registerForActivityResult

                  if (result.resultCode == Activity.RESULT_OK) {
                      val data = result.data
                      val uris = mutableListOf<Uri>()
                      data?.data?.let { uris.add(it) }
                      data?.clipData?.let { clip ->
                          for (i in 0 until clip.itemCount) {
                              clip.getItemAt(i).uri?.let { uris.add(it) }
                          }
                      }
                      cb.onReceiveValue(if (uris.isNotEmpty()) uris.toTypedArray() else null)
                  } else {
                      cb.onReceiveValue(null)
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge(
                      statusBarStyle = SystemBarStyle.dark(Color.TRANSPARENT),
                      navigationBarStyle = SystemBarStyle.dark(Color.TRANSPARENT)
                  )

                  webView = WebView(this).apply {
                      setBackgroundColor(Color.BLACK)
                  }
                  setContentView(webView)

                  val assetLoader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                      .build()

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      allowFileAccess = false
                  }

                  webView.addJavascriptInterface(AndroidBridge(), "AndroidBridge")

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(
                          view: WebView,
                          request: WebResourceRequest
                      ): WebResourceResponse? {
                          val response = assetLoader.shouldInterceptRequest(request.url) ?: return null
                          val path = request.url.path ?: ""
                          when {
                              path.endsWith(".mjs") || path.endsWith(".js") -> response.mimeType = "application/javascript"
                              path.endsWith(".wasm") -> response.mimeType = "application/wasm"
                              path.endsWith(".tflite") -> response.mimeType = "application/octet-stream"
                          }
                          return response
                      }
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onPermissionRequest(request: PermissionRequest?) {
                          if (request == null) return
                          runOnUiThread {
                              val isTrustedOrigin = request.origin?.toString()
                                  ?.startsWith("https://appassets.androidplatform.net") == true
                              if (!isTrustedOrigin) {
                                  request.deny()
                                  return@runOnUiThread
                              }

                              if (ContextCompat.checkSelfPermission(this@MainActivity, Manifest.permission.CAMERA)
                                  == PackageManager.PERMISSION_GRANTED
                              ) {
                                  request.grant(request.resources)
                              } else {
                                  pendingPermissionRequest = request
                                  cameraLauncher.launch(Manifest.permission.CAMERA)
                              }
                          }
                      }

                      override fun onPermissionRequestCanceled(request: PermissionRequest?) {
                          if (pendingPermissionRequest == request) {
                              pendingPermissionRequest = null
                          }
                      }

                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePathCallback: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {
                          this@MainActivity.filePathCallback?.onReceiveValue(null)
                          this@MainActivity.filePathCallback = filePathCallback

                          val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "*/*"
                          }
                          val chooser = Intent.createChooser(intent, "Chọn file LUT (.cube)")
                          return try {
                              fileChooserLauncher.launch(chooser)
                              true
                          } catch (e: Exception) {
                              this@MainActivity.filePathCallback = null
                              Toast.makeText(this@MainActivity, "Không mở được trình chọn tệp", Toast.LENGTH_SHORT).show()
                              false
                          }
                      }
                  }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          webView.evaluateJavascript(
                              "(function(){ if(window.handleBackAction && window.handleBackAction()) return 'handled'; return 'exit'; })()"
                          ) { result ->
                              if (result != "\"handled\"") {
                                  isEnabled = false
                                  onBackPressedDispatcher.onBackPressed()
                              }
                          }
                      }
                  })

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)
                      == PackageManager.PERMISSION_GRANTED
                  ) {
                      webView.loadUrl(appUrl)
                  } else {
                      cameraLauncher.launch(Manifest.permission.CAMERA)
                  }
              }

              override fun onPause() {
                  super.onPause()
                  webView.onPause()
              }

              override fun onResume() {
                  super.onResume()
                  webView.onResume()
              }

              override fun onDestroy() {
                  filePathCallback?.onReceiveValue(null)
                  filePathCallback = null
                  webView.destroy()
                  super.onDestroy()
              }

              inner class AndroidBridge {
                  @JavascriptInterface
                  fun saveImage(base64DataUrl: String, fileName: String) {
                      try {
                          val base64Clean = base64DataUrl.substringAfter("base64,")
                          val bytes = Base64.decode(base64Clean, Base64.DEFAULT)

                          val values = ContentValues().apply {
                              put(MediaStore.Images.Media.DISPLAY_NAME, fileName)
                              put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  put(MediaStore.Images.Media.RELATIVE_PATH, "${Environment.DIRECTORY_PICTURES}/AICamera")
                                  put(MediaStore.Images.Media.IS_PENDING, 1)
                              }
                          }

                          val uri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values)
                          if (uri != null) {
                              contentResolver.openOutputStream(uri)?.use { os -> os.write(bytes) }
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  values.clear()
                                  values.put(MediaStore.Images.Media.IS_PENDING, 0)
                                  contentResolver.update(uri, values, null, null)
                              }
                              runOnUiThread {
                                  Toast.makeText(this@MainActivity, "Đã lưu ảnh vào Thư viện!", Toast.LENGTH_SHORT).show()
                              }
                          } else {
                              throw IllegalStateException("Không tạo được tệp ảnh trong MediaStore")
                          }
                      } catch (e: Exception) {
                          runOnUiThread {
                              Toast.makeText(this@MainActivity, "Lỗi lưu ảnh: ${e.message}", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
              }
          }
          EOF

          cat << 'HTML_EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="vi">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
            <meta name="theme-color" content="#000000" />
            <title>AI Camera Pro</title>
            <style>
              :root {
                --bg: #000000;
                --glass: rgba(18, 18, 22, 0.62);
                --glass-panel: rgba(16, 16, 20, 0.86);
                --border: rgba(255, 255, 255, 0.14);
                --text: #fafafa;
                --muted: #a1a1aa;
                --green: #22c55e;
                --green-glow: rgba(34, 197, 94, 0.35);
                --amber: #f59e0b;
                --safe-top: env(safe-area-inset-top, 14px);
                --safe-bottom: env(safe-area-inset-bottom, 18px);
              }

              * {
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
                user-select: none;
              }

              html, body {
                margin: 0; padding: 0; width: 100%; height: 100%;
                background: var(--bg); color: var(--text);
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                overflow: hidden; touch-action: manipulation;
              }

              .app { position: relative; width: 100%; height: 100%; background: #000; }

              .stage {
                position: absolute; inset: 0; width: 100%; height: 100%;
                overflow: hidden; background: #050507;
              }

              #cameraVideo, #glCanvas, #overlayCanvas {
                position: absolute; inset: 0; width: 100%; height: 100%;
                object-fit: cover;
              }

              #cameraVideo { opacity: 0; pointer-events: none; z-index: 0; }
              #cameraVideo.fallback-visible { opacity: 1; }
              #glCanvas { z-index: 1; pointer-events: none; }
              #overlayCanvas { z-index: 2; pointer-events: none; }

              #cameraVideo.mirrored, #glCanvas.mirrored, #overlayCanvas.mirrored {
                transform: scaleX(-1);
              }

              .top-hud {
                position: absolute; top: 0; left: 0; right: 0; z-index: 10;
                padding: calc(var(--safe-top) + 12px) 16px 24px;
                background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.28) 65%, rgba(0,0,0,0) 100%);
                display: flex; flex-direction: column; gap: 10px; pointer-events: none;
              }

              .top-row {
                display: flex; align-items: center; justify-content: space-between;
                gap: 8px; pointer-events: auto;
              }

              .status-pill {
                display: inline-flex; align-items: center; gap: 8px; padding: 8px 13px;
                border-radius: 999px; background: var(--glass);
                backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
                border: 1px solid var(--border); font-size: 12px; font-weight: 600;
                transition: all 0.25s ease;
              }

              .status-pill.good {
                background: rgba(20, 83, 45, 0.74); border-color: rgba(74, 222, 128, 0.65);
                color: #dcfce7; box-shadow: 0 4px 20px var(--green-glow);
              }

              .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); flex-shrink: 0; }
              .status-pill.good .status-dot { background: #4ade80; box-shadow: 0 0 10px #4ade80; }
              .status-pill.loading .status-dot { background: #60a5fa; animation: pulse 1.1s infinite; }

              @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.75); } }

              .top-controls { display: flex; align-items: center; gap: 6px; }

              .ai-chip-btn {
                display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 11px;
                border-radius: 999px; border: 1px solid var(--border); background: var(--glass);
                backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
                color: var(--muted); font-size: 11.5px; font-weight: 700; cursor: pointer;
              }

              .ai-chip-btn.on {
                border-color: rgba(74, 222, 128, 0.5); background: rgba(20, 83, 45, 0.52); color: #bbf7d0;
              }

              .ratio-switch {
                display: flex; align-items: center; padding: 3px; border-radius: 999px;
                background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
                border: 1px solid var(--border);
              }

              .ratio-btn {
                border: none; background: transparent; color: rgba(255,255,255,0.68);
                font-size: 11.5px; font-weight: 700; padding: 5px 11px; border-radius: 999px; cursor: pointer;
              }

              .ratio-btn.active { background: #ffffff; color: #09090b; }

              .telemetry-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

              .tele-chip {
                display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px;
                border-radius: 6px; background: rgba(0, 0, 0, 0.45);
                border: 1px solid rgba(255,255,255,0.08);
                font-size: 10.5px; font-weight: 600; color: rgba(255,255,255,0.72); letter-spacing: 0.3px;
              }

              .color-drawer {
                position: absolute; left: 12px; right: 12px;
                bottom: calc(var(--safe-bottom) + 114px);
                z-index: 12; padding: 14px 14px 12px;
                border-radius: 22px; background: var(--glass-panel);
                backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
                border: 1px solid rgba(255,255,255,0.14);
                box-shadow: 0 18px 42px rgba(0,0,0,0.65);
                display: none; flex-direction: column; gap: 12px;
              }

              .color-drawer.open {
                display: flex;
                animation: slideUp 0.18s cubic-bezier(0.22, 1, 0.36, 1);
              }

              @keyframes slideUp {
                from { opacity: 0; transform: translateY(14px); }
                to { opacity: 1; transform: translateY(0); }
              }

              .slider-row { display: flex; flex-direction: column; gap: 6px; }

              .slider-head {
                display: flex; align-items: center; justify-content: space-between;
                font-size: 12px; font-weight: 600;
              }

              .slider-label { color: rgba(255,255,255,0.88); display: flex; align-items: center; gap: 6px; }
              .slider-val { color: #fde68a; font-variant-numeric: tabular-nums; font-weight: 700; }

              .mini-reset {
                border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.08);
                color: #e4e4e7; font-size: 10.5px; font-weight: 600;
                padding: 2px
