                padding: 5px 11px; border-radius: 999px;
              }

              .preview-frame {
                flex: 1; display: flex; align-items: center; justify-content: center;
                overflow: hidden; border-radius: 18px; background: #0e0e12;
                border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.6);
              }

              .preview-frame img { max-width: 100%; max-height: 100%; object-fit: contain; }
              .preview-actions { display: grid; grid-template-columns: 1fr 1.45fr; gap: 12px; margin-top: 16px; }

              .action-btn {
                min-height: 50px; border-radius: 14px; border: 1px solid var(--border);
                font-size: 14px; font-weight: 700; cursor: pointer;
                display: inline-flex; align-items: center; justify-content: center; gap: 8px;
                transition: transform 0.12s ease;
              }

              .action-btn:active { transform: scale(0.97); }
              .btn-retake { background: #1e1e24; color: var(--text); }
              .btn-save {
                background: linear-gradient(135deg, #22c55e, #16a34a); color: #032210;
                border-color: #4ade80; box-shadow: 0 8px 24px rgba(34, 197, 94, 0.25);
              }

              .error-sheet {
                position: absolute; inset: 0; z-index: 25; background: rgba(5, 5, 7, 0.94);
                display: none; flex-direction: column; align-items: center; justify-content: center;
                text-align: center; padding: 32px; gap: 14px;
              }
              .error-sheet.show { display: flex; }
              .error-sheet h2 { margin: 0; font-size: 19px; }
              .error-sheet p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--muted); max-width: 320px; }

              .toast-pill {
                position: fixed; top: calc(var(--safe-top) + 64px); left: 50%; transform: translateX(-50%);
                z-index: 50; background: rgba(24, 24, 29, 0.94); border: 1px solid rgba(255,255,255,0.18);
                color: #fff; font-size: 12.5px; font-weight: 600; padding: 9px 16px;
                border-radius: 999px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                white-space: nowrap;
              }
              .toast-pill.show { display: block; }

              .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 40; transition: opacity 0.16s ease; }
              .flash.active { opacity: 0.72; transition: none; }
            </style>
          </head>
          <body>
            <div class="app">
              <div class="stage" id="stage">
